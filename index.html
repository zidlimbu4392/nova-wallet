<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#F2F2F7" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.lordicon.com/lordicon.js"></script>
  <title>Nova Wallet — Crypto Wallet</title>
  <meta name="description" content="Nova Wallet — modern crypto wallet." />
  
  <!-- UNREGISTER OLD SERVICE WORKERS -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
          console.log("Unregistered old SW:", registration);
        }
      }).catch(function(err) {
        console.error("SW Unregistration failed: ", err);
      });
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/assets/styles/base.css?v=160" />
  <link rel="stylesheet" href="/assets/styles/components.css?v=182" />
  <link rel="stylesheet" href="/assets/styles/screens.css?v=181" />
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <!-- Анимированный фон (iOS wallpaper style) -->
  <div class="bg" id="bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="blob blob-4"></span>
    <div class="bg-grain"></div>
  </div>

  <!-- Рамка телефона (на десктопе) -->
  <div class="device">
    <div class="device-notch"></div>
    <div class="device-screen">
      <!-- Глобальный лоадер (в самом верху для мгновенного покрытия) -->
      <div id="global-loader" style="position:absolute; top:0; left:0; right:0; bottom:0; z-index:9999; background:#fff; display:flex; align-items:center; justify-content:center; transition:opacity 0.5s ease;">
        <svg width="44" height="44" viewBox="0 0 50 50" style="animation: spin 0.8s linear infinite;">
          <circle cx="25" cy="25" r="20" fill="none" stroke="#775bf2" stroke-width="4" stroke-linecap="round" stroke-dasharray="80 150" />
        </svg>
      </div>
      
      <!-- Статус-бар -->
      <div class="statusbar">
        <span class="statusbar-time" id="statusTime">9:41</span>
        <span class="statusbar-right">
          <svg class="sb-icon" viewBox="0 0 18 12" fill="currentColor"><path d="M1 9h2v3H1zM5 7h2v5H5zM9 5h2v7H9zM13 2h2v10h-2z" opacity=".25"/><path d="M1 9h2v3H1zM5 7h2v5H5zM9 5h2v7H9zM13 2h2v10h-2z"/></svg>
          <svg class="sb-icon" viewBox="0 0 16 12" fill="currentColor"><path d="M8 3.6c1.8 0 3.5.7 4.7 1.9l1.4-1.4C12.5 2.5 10.3 1.5 8 1.5S3.5 2.5 1.9 4.1l1.4 1.4C4.5 4.3 6.2 3.6 8 3.6zm0 3c1 0 1.9.4 2.6 1.1l1.4-1.4C10.9 5.2 9.5 4.6 8 4.6s-2.9.6-4 1.7l1.4 1.4C6.1 7 7 6.6 8 6.6zM8 9.5l1.9 1.9L8 13.3l-1.9-1.9L8 9.5z"/></svg>
          <svg class="sb-battery" viewBox="0 0 27 13" fill="none"><rect x="1" y="1" width="22" height="11" rx="3" stroke="currentColor" opacity=".35" stroke-width="1"/><rect x="3" y="3" width="18" height="7" rx="1.5" fill="currentColor"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="currentColor" opacity=".35"/></svg>
        </span>
      </div>

      <!-- Контент экранов -->
      <main class="app" id="app"></main>

      <!-- Тосты (внутри экрана телефона) -->
      <div class="toast-host" id="toastHost" aria-live="polite"></div>

      <!-- Нижние шторки (внутри экрана телефона) -->
      <div class="sheet-host" id="sheetHost" aria-hidden="true"></div>

      <!-- Полноэкранная push-навигация (выезжает справа) -->
      <div class="push-host" id="pushHost" aria-hidden="true"></div>
      
      <!-- Нижняя навигация (в самом конце DOM, чтобы всегда была поверх всего) -->
      <nav class="tabbar" id="tabbar" style="z-index: 99999 !important; will-change: transform;"></nav>

      <!-- Домашний индикатор -->
      <div class="home-indicator"></div>

      <!-- Виньетка под таббаром -->
      <div class="bottom-scrim" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Ethers.js for client-side wallet generation -->
  <script src="/assets/js/ethers.min.js"></script>
  <!-- Скрипты (порядок важен: данные -> ядро -> экраны -> приложение) -->
  <script src="/assets/js/data.js?v=155"></script>
  <script src="/assets/js/store.js?v=155"></script>
  <script src="/assets/js/ui.js?v=155"></script>
  <script src="/assets/js/background.js?v=155"></script>
  <script src="/assets/js/screens/welcome.js?v=181"></script>
  <script src="/assets/js/screens/dashboard.js?v=200"></script>
  <script src="/assets/js/screens/swap.js?v=155"></script>
  <script src="/assets/js/screens/profile.js?v=165"></script>
  <script src="/assets/js/screens/stocks.js?v=173"></script>
  <script src="/assets/js/screens/whales_v2.js?v=173"></script>
  <script src="/assets/js/screens/whale_profile_v2.js?v=155"></script>
  <script src="/assets/js/screens/p2p.js?v=159"></script>
  <script src="/assets/js/app.js?v=182"></script>
  <script src="/assets/js/screens/activity.js?v=155"></script>
  <script src="/assets/js/screens/token.js?v=170"></script>
  <script src="/assets/js/screens/admin.js?v=166"></script>
  <script src="/assets/js/screens/send.js?v=155"></script>
  <script src="/assets/js/screens/receive.js?v=155"></script>
</body>
</html>
