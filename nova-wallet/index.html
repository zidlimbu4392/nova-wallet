<html lang="en" translate="no">
<head>

  <meta charset="UTF-8" />
  <meta name="theme-color" content="#F2F2F7" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Nova Wallet — Crypto Wallet</title>
  <meta name="description" content="Nova Wallet — современный криптокошелек. Портфолио проект." />

  <link rel="stylesheet" href="assets/styles/components.css?v=10882" />
  <link rel="stylesheet" href="assets/styles/screens.css?v=10882" />
</head>
<body>
  <!-- Анимированный фон (iOS wallpaper style) -->
  <div class="bg" id="bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="blob blob-4"></span>
    <div class="bg-grain"></div>
  </div>

  <!-- Рамка телефона (на десктопе) -->
  <div class="device">
    <div class="device-notch"></div>
    <div class="device-screen">
      <!-- Статус-бар -->
      <div class="statusbar">
        <span class="statusbar-time" id="statusTime">9:41</span>
        <span class="statusbar-right">
          <svg class="sb-icon" viewBox="0 0 18 12" fill="currentColor"><path d="M1 9h2v3H1zM5 7h2v5H5zM9 5h2v7H9zM13 2h2v10h-2z" opacity=".25"/><path d="M1 9h2v3H1zM5 7h2v5H5zM9 5h2v7H9zM13 2h2v10h-2z"/></svg>
          <svg class="sb-icon" viewBox="0 0 16 12" fill="currentColor"><path d="M8 3.6c1.8 0 3.5.7 4.7 1.9l1.4-1.4C12.5 2.5 10.3 1.5 8 1.5S3.5 2.5 1.9 4.1l1.4 1.4C4.5 4.3 6.2 3.6 8 3.6zm0 3c1 0 1.9.4 2.6 1.1l1.4-1.4C10.9 5.2 9.5 4.6 8 4.6s-2.9.6-4 1.7l1.4 1.4C6.1 7 7 6.6 8 6.6zM8 9.5l1.9 1.9L8 13.3l-1.9-1.9L8 9.5z"/></svg>
          <svg class="sb-battery" viewBox="0 0 27 13" fill="none"><rect x="1" y="1" width="22" height="11" rx="3" stroke="currentColor" opacity=".35" stroke-width="1"/><rect x="3" y="3" width="18" height="7" rx="1.5" fill="currentColor"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="currentColor" opacity=".35"/></svg>
        </span>
      </div>

      <!-- Контент экранов -->
      <main class="app" id="app"></main>

      <!-- Нижняя навигация -->
      <nav class="tabbar" id="tabbar"></nav>

      <!-- Домашний индикатор -->
      <div class="home-indicator"></div>

      <!-- Виньетка под таббаром -->
      <div class="bottom-scrim" aria-hidden="true"></div>

      <!-- Тосты (внутри экрана телефона) -->
      <div class="toast-host" id="toastHost" aria-live="polite"></div>

      <!-- Нижние шторки (внутри экрана телефона) -->
      <div class="sheet-host" id="sheetHost" aria-hidden="true"></div>

      <!-- Полноэкранная push-навигация (выезжает справа) -->
      <div class="push-host" id="pushHost" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Скрипты (порядок важен: данные -> ядро -> экраны -> приложение) -->
  <script src="assets/js/data.js?v=10882"></script>
  <script src="assets/js/store.js?v=10882"></script>
  <script src="assets/js/ui.js?v=10882"></script>
  <script src="assets/js/background.js?v=10882"></script>
  <script src="assets/js/screens/dashboard.js?v=10882"></script>
  <script src="assets/js/screens/swap.js?v=10882"></script>
  <script src="assets/js/screens/nft.js?v=10882"></script>
  <script src="assets/js/screens/staking.js?v=10882"></script>
  <script src="assets/js/screens/activity.js?v=10882"></script>
  <script src="assets/js/screens/token.js?v=10882"></script>
  <script src="assets/js/screens/send.js?v=10882"></script>
  <script src="assets/js/screens/receive.js?v=10882"></script>
  <script src="assets/js/app.js?v=10882"></script>
</body>
</html>
