services:
  nova-wallet:
    build:
      context: .
      dockerfile: Dockerfile
    image: nova-wallet:latest
    container_name: nova-wallet
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
